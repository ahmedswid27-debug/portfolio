<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0E14; }
  .bg { position: absolute; inset: 0; background: url(../../public/riyadh/lamps-hero.jpg) center/cover; }
  .v { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,20,.35), rgba(11,14,20,.7) 55%, #0B0E14); }
  .h { position: absolute; inset: 0; background: linear-gradient(to left, #0B0E14, rgba(11,14,20,.65) 50%, rgba(11,14,20,.1)); }
  .c { position: absolute; inset: 0; padding: 0 84px; display: flex; flex-direction: column; justify-content: center; font-family: Cairo, sans-serif; }
  .p { align-self: flex-start; font-size: 24px; font-weight: 700; padding: 6px 22px; border-radius: 999px; color: #C9A86A; background: rgba(201,168,106,.12); border: 1.5px solid rgba(201,168,106,.35); }
  h1 { margin: 22px 0 0; font-size: 104px; font-weight: 900; line-height: 1.32; padding-bottom: 6px;
       background: linear-gradient(180deg, #F3E4BE 0%, #C9A86A 55%, #9A7B3F 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 10px 0 0; font-size: 34px; font-weight: 700; color: rgba(255,255,255,.82); }
  .u { position: absolute; bottom: 40px; right: 84px; font: 700 24px Cairo, sans-serif; color: rgba(201,168,106,.85); direction: ltr; }
</style>
</head>
<body>
  <div class="bg"></div><div class="v"></div><div class="h"></div>
  <div class="c">
    <span class="p">خبير Power BI</span>
    <h1>أحمد محمود سويد</h1>
    <p>محلل بيانات وأعمال</p>
  </div>
  <div class="u">www.ahmedswid.com</div>
</body>
</html>
